const letters=['A','B','C','D'];let order=[],pos=0,score=0,answered=0,locked=false,session=[];
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle(BANK.map((_,i)=>i));pos=0;score=0;answered=0;locked=false;session=[];$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){locked=false;const d=BANK[order[pos]];const perm=shuffle([0,1,2,3]);session[pos]={idx:order[pos],perm,chosen:null};$('qnum').textContent=`QUESTION ${pos+1} / 50`;$('question').textContent=d.q;$('ml').textContent=d.ml;$('progressText').textContent=`Question ${pos+1} of ${BANK.length}`;$('scoreText').textContent=`Score: ${score}`;$('answeredText').textContent=`Answered: ${answered}`;$('progressBar').style.width=`${answered/BANK.length*100}%`;$('feedback').className='feedback hidden';$('feedback').innerHTML='';$('next').disabled=true;$('next').textContent=pos===BANK.length-1?'Finish / പൂർത്തിയാക്കുക':'Next Question / അടുത്ത ചോദ്യം';$('options').innerHTML='';perm.forEach((originalIndex,displayIndex)=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="letter">${letters[displayIndex]}</span><span>${escapeHtml(d.opts[originalIndex])}</span>`;b.addEventListener('click',()=>choose(originalIndex,displayIndex));$('options').appendChild(b)})}
function playFeedbackSound(isCorrect){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ctx=new Ctx();const now=ctx.currentTime;function tone(freq,start,duration,type,volume){const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,now+start);gain.gain.setValueAtTime(0.0001,now+start);gain.gain.exponentialRampToValueAtTime(volume,now+start+0.02);gain.gain.exponentialRampToValueAtTime(0.0001,now+start+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(now+start);osc.stop(now+start+duration+0.03)}if(isCorrect){tone(660,0,0.16,'sine',0.16);tone(880,0.13,0.22,'sine',0.16);tone(1100,0.28,0.24,'sine',0.14)}else{tone(220,0,0.20,'square',0.09);tone(165,0.18,0.25,'square',0.08)}setTimeout(()=>ctx.close().catch(()=>{}),900)}catch(e){}}
function choose(originalIndex,displayIndex){if(locked)return;locked=true;const d=BANK[order[pos]],s=session[pos];s.chosen=originalIndex;answered++;const correct=originalIndex===d.a;playFeedbackSound(correct);if(correct)score++;[...$('options').children].forEach((b,i)=>{const oi=s.perm[i];b.disabled=true;if(oi===d.a)b.classList.add('correct');else if(oi===originalIndex)b.classList.add('wrong')});const f=$('feedback');f.className='feedback '+(correct?'good':'bad');let html=`<h3>${correct?'Correct! ശരിയുത്തരം':'Not quite. ശരിയുത്തരം'}</h3><p><b>Correct answer: ${letters[s.perm.indexOf(d.a)]}. ${escapeHtml(d.opts[d.a])}</b></p><p>${escapeHtml(d.ex)}</p><p>${escapeHtml(d.exml)}</p><div class="choice-explanations"><b>Explanation for every option / ഓരോ ഓപ്ഷന്റെയും വിശദീകരണം</b>`;s.perm.forEach((oi,di)=>{const e=d.optionEx[oi];html+=`<div class="explain ${oi===d.a?'right':''}"><b>${letters[di]}. ${escapeHtml(d.opts[oi])} ${oi===d.a?'✓':''}</b><div>${escapeHtml(e.en)}</div><div>${escapeHtml(e.ml)}</div></div>`});html+='</div>';f.innerHTML=html;$('scoreText').textContent=`Score: ${score}`;$('answeredText').textContent=`Answered: ${answered}`;$('progressBar').style.width=`${answered/BANK.length*100}%`;$('next').disabled=false;f.scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){if(!locked)return;if(pos<BANK.length-1){pos++;render();window.scrollTo({top:0,behavior:'smooth'})}else{showResult()}}
function showResult(){$('quiz').classList.add('hidden');const r=$('result');r.classList.remove('hidden');r.innerHTML=`<h2>Test Completed / പരീക്ഷ പൂർത്തിയായി</h2><p><strong>Score: ${score} / ${BANK.length}</strong></p><p>Correct: ${score} · Incorrect: ${answered-score}</p><p>Review the explanations and restart for a newly shuffled question set.</p><button class="btn primary" id="restartResult">Restart with New Order / പുതിയ ക്രമത്തിൽ വീണ്ടും തുടങ്ങുക</button>`;$('restartResult').addEventListener('click',start);r.scrollIntoView({behavior:'smooth'})}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('restart').addEventListener('click',start);$('next').addEventListener('click',next);start();
</script></body></html>
